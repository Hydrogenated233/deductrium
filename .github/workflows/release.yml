name: Package Release

on:
  push:
    tags:
      - "hott-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to hott-vYYYY.MM.DD using China Standard Time)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $releaseDate = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString("yyyy.MM.dd", [Globalization.CultureInfo]::InvariantCulture)
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) {
            $tag = if ("${{ github.ref_type }}" -eq "tag") {
              "${{ github.ref_name }}"
            } else {
              "hott-v$releaseDate"
            }
          }
          if ($tag -notmatch '^hott-v[0-9A-Za-z._-]+$') {
            throw "Release tag must start with hott-v and contain only letters, digits, dot, underscore, or hyphen."
          }
          "date=$releaseDate" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=Deductrium HoTT Optimization $releaseDate" >> $env:GITHUB_OUTPUT

      - name: Build release archive
        env:
          DEDUCTRIUM_RELEASE_DATE: ${{ steps.release.outputs.date }}
        run: npm run package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.tag }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          $archive = Get-ChildItem -LiteralPath release -Filter *.zip -File | Select-Object -First 1
          if (-not $archive) { throw "Release archive was not generated." }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # A second package on the same CST date reuses the release. Move
            # its lightweight tag as well as replacing the ZIP so the release
            # metadata and archive both refer to this workflow's commit.
            gh api --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" `
              -f "sha=$env:GITHUB_SHA" `
              -F "force=true"
            if ($LASTEXITCODE -ne 0) { throw "Failed to retarget existing release tag." }

            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE
            if ($LASTEXITCODE -ne 0) { throw "Failed to update existing release metadata." }

            gh release upload $env:RELEASE_TAG $archive.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $archive.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --generate-notes
          }
